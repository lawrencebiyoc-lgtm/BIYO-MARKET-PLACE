<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087443">
<title>BIYO Marketplace | Malawi</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#202820}
header{background:#087443;color:white;padding:20px 16px}
.brand{font-size:26px;font-weight:bold}
.container{max-width:900px;margin:auto;padding:16px}
.search{margin-bottom:18px}
input,select,button{font-size:16px;padding:12px;border-radius:8px}
input,select{border:1px solid #ccc;width:100%;background:white}
button{border:none;background:#087443;color:white;cursor:pointer;font-weight:bold}
.sell-box,.product{background:white;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0000000c}
.sell-box button,.product button{width:100%;margin-top:10px}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.product img{width:100%;height:170px;object-fit:cover;border-radius:8px}
.price{color:#087443;font-size:21px;font-weight:bold}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.empty{text-align:center;background:white;padding:20px;grid-column:1/-1}
footer{text-align:center;padding:25px;color:#666}
</style>
</head>

<body>
<header>
  <div class="brand">🛍️ BIYO MARKETPLACE</div>
  <p>Buy and sell in Malawi. Connect directly with sellers.</p>
</header>

<main class="container">
  <h2>Find what you need</h2>

  <div class="search">
    <input id="search" type="search" placeholder="Search products..." oninput="displayProducts()">
  </div>

  <section class="sell-box">
    <h2>Sell on BIYO</h2>
    <p>List your product and let buyers contact you through WhatsApp.</p>

    <form id="productForm">
      <input id="name" placeholder="Product name" required><br><br>
      <input id="price" type="number" min="1" placeholder="Price in MWK" required><br><br>

      <select id="category" required>
        <option value="">Choose category</option>
        <option>Phones & Electronics</option>
        <option>Clothing & Shoes</option>
        <option>Vehicles</option>
        <option>Property</option>
        <option>Agriculture</option>
        <option>Home & Furniture</option>
        <option>Other</option>
      </select><br><br>

      <input id="location" placeholder="Location, e.g. Zomba" required><br><br>
      <input id="phone" type="tel" placeholder="WhatsApp number, e.g. 265991234567" required><br><br>
      <input id="image" type="url" placeholder="Product image URL (optional)"><br><br>

      <button type="submit">List Product</button>
    </form>
  </section>

  <h2>Browse Products</h2>

  <div class="filters">
    <select id="filter" onchange="displayProducts()">
      <option value="">All categories</option>
      <option>Phones & Electronics</option>
      <option>Clothing & Shoes</option>
      <option>Vehicles</option>
      <option>Property</option>
      <option>Agriculture</option>
      <option>Home & Furniture</option>
      <option>Other</option>
    </select>
    <button type="button" onclick="showAll()">Show All</button>
  </div>

  <div id="products"></div>
</main>

<footer>
  <p>BIYO Marketplace 🇲🇼</p>
  <p>Connecting buyers and sellers across Malawi.</p>
</footer>

<script>
const STORAGE_KEY = "biyo_marketplace_products_v1";
let products = [];

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  products = Array.isArray(saved) ? saved : [];
} catch (error) {
  products = [];
}

function saveProducts() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    return true;
  } catch (error) {
    alert("Could not save the listing on this device.");
    return false;
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(character) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character];
  });
}

function displayProducts() {
  const search = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("filter").value;
  const container = document.getElementById("products");

  const filtered = products.filter(function(product) {
    const text = (product.name + " " + product.location + " " + product.category).toLowerCase();
    return text.includes(search) && (!category || product.category === category);
  });

  if (!filtered.length) {
    container.innerHTML = '<div class="empty">No products found. Be the first to list a product!</div>';
    return;
  }

  container.innerHTML = filtered.map(function(product) {
    const imageHTML = product.image
      ? '<img src="' + escapeHTML(product.image) + '" alt="' + escapeHTML(product.name) + '" onerror="this.style.display=\'none\'">'
      : "";

    return `
      <article class="product">
        ${imageHTML}
        <h3>${escapeHTML(product.name)}</h3>
        <p class="price">MWK ${Number(product.price).toLocaleString()}</p>
        <p>Category: ${escapeHTML(product.category)}</p>
        <p>📍 ${escapeHTML(product.location)}</p>
        <button type="button" onclick="contactSeller('${product.id}')">Contact Seller on WhatsApp</button>
      </article>
    `;
  }).join("");
}

document.getElementById("productForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const price = Number(document.getElementById("price").value);
  const category = document.getElementById("category").value;
  const location = document.getElementById("location").value.trim();
  const phone = document.getElementById("phone").value.replace(/\D/g, "");
  const image = document.getElementById("image").value.trim();

  if (!name || !category || !location || price <= 0 || phone.length < 10) {
    alert("Enter valid product details and a WhatsApp number with country code.");
    return;
  }

  const product = {
    id: String(Date.now()),
    name: name,
    price: price,
    category: category,
    location: location,
    phone: phone,
    image: image
  };

  products.unshift(product);

  if (!saveProducts()) {
    products.shift();
    return;
  }

  this.reset();
  displayProducts();
  alert("Product listed on this device!");
});

function contactSeller(id) {
  const product = products.find(function(item) {
    return item.id === id;
  });

  if (!product) return;

  const message = "Hello, I saw " + product.name +
    " on BIYO Marketplace. Is it available?";

  window.open(
    "https://wa.me/" + product.phone + "?text=" + encodeURIComponent(message),
    "_blank"
  );
}

function showAll() {
  document.getElementById("search").value = "";
  document.getElementById("filter").value = "";
  displayProducts();
}

displayProducts();
</script>
</body>
</html>
